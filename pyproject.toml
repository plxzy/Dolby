[project]
name = "dolby-tool"
dynamic = ["version"]
description = "Local web app for inspecting Dolby Vision / HDR / Atmos files and live-capturing TV.app playback specs"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["dolby-vision", "hdr", "atmos", "ffprobe", "hls", "apple-tv", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastapi>=0.152",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28.1",
]

[project.scripts]
dolby-tool = "dolby_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dolby_tool/__init__.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
    # Starlette's TestClient nudges towards `httpx2`; FastAPI's TestClient still re-exports it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "requires_ffmpeg: needs ffmpeg/ffprobe on PATH (skipped otherwise)",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "SIM", "PERF", "RUF", "ASYNC"]
# RUF001-003: the codebase deliberately uses typographic characters (—, →, ·) in strings and comments.
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "PERF401"]

[tool.ruff.format]
docstring-code-format = true
