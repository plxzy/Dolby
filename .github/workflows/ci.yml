name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    # The whole job normally takes under a minute; fail fast if a runner stalls.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Static GPL build (libx264/libx265/eac3) from GitHub releases, cached. apt-get
      # occasionally stalled for 10-25 minutes on Ubuntu's mirrors.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1-gpl-${{ runner.os }}-${{ runner.arch }}

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -fsSL --retry 3 --max-time 180 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            | tar -xJ --strip-components=2 -C ~/ffmpeg --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'

      - name: Add ffmpeg to PATH
        run: |
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/ffmpeg" -hide_banner -encoders | grep -E 'libx264|libx265|eac3' >/dev/null

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
